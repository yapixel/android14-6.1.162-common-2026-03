name: Build Enhance Kernel (GitHub-hosted) for Pixel 8 Series

concurrency:
  group: enhance-kernel-build-hosted-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      enable_telegram:
        description: 'Enable Telegram notifications'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean
      tuning_profile:
        description: 'Pixel 8 tuning profile'
        required: false
        default: 'balanced'
        type: choice
        options: [balanced, performance, battery]
      lto_mode:
        description: 'LTO mode'
        required: false
        default: 'thin'
        type: choice
        options: [thin, full, none]
      make_jobs:
        description: 'Parallel make jobs (auto or integer)'
        required: false
        default: 'auto'
        type: string
      include_runtime_tuner:
        description: 'Include Pixel 8 runtime tuner script'
        required: false
        default: true
        type: boolean
      governor_mode:
        description: 'CPU governor mode'
        required: false
        default: 'dynasched'
        type: choice
        options: [dynasched, stock_schedutil]
      kerneltoast_patch_policy:
        description: 'Kerneltoast patch policy'
        required: false
        default: 'best_effort'
        type: choice
        options: [strict, best_effort, 'off']
      dry_run_only:
        description: 'Validate source sync and patch application only'
        required: false
        default: false
        type: boolean
      dirty_build:
        description: 'Incremental build; useful only on persistent runners'
        required: false
        default: false
        type: boolean
      dirty_module_abi_bypass:
        description: 'Allow loading built-in KSU kernel without matching kernelsu.ko ABI'
        required: false
        default: true
        type: boolean
      android_version:
        description: 'Android version target'
        required: false
        default: 'android16'
        type: choice
        options: [android14, android16, android17]
      kernel_ref:
        description: 'Override kernel ref. Leave empty to use workflow default for android_version.'
        required: false
        default: ''
        type: string
      susfs_ref:
        description: 'Override SuSFS ref. Leave empty to use workflow default for android_version.'
        required: false
        default: ''
        type: string
      tiann_ref:
        description: 'Override Tiann KernelSU ref for non-enhance tooling'
        required: false
        default: '0544f475962fd7f27d27ae24a7ab3ee2a8d7538a'
        type: string
      stock_boot_img_url:
        description: 'URL to stock akita boot.img. Enhance skips boot repack by default; keep empty normally.'
        required: false
        default: ''
        type: string
      stock_boot_gdrive_id:
        description: 'Google Drive file ID or URL for stock akita boot.img. Keep empty normally.'
        required: false
        default: ''
        type: string

jobs:
  build-enhance:
    uses: ./.github/workflows/kernel-build.yml
    secrets: inherit
    with:
      use_self_hosted: false
      ksu_variant: enhance
      disable_susfs: ${{ inputs.disable_susfs }}
      force_clean_build: ${{ inputs.force_clean_build }}
      enable_telegram: ${{ inputs.enable_telegram }}
      create_release: ${{ inputs.create_release }}
      dry_run_only: ${{ inputs.dry_run_only }}
      dirty_build: ${{ inputs.dirty_build }}
      android_version: ${{ inputs.android_version }}
      refs: |
        kernel_ref=${{ inputs.kernel_ref }}
        susfs_ref=${{ inputs.susfs_ref }}
        tiann_ref=${{ inputs.tiann_ref }}
      build_options: |
        tuning_profile=${{ inputs.tuning_profile }}
        lto_mode=${{ inputs.lto_mode }}
        make_jobs=${{ inputs.make_jobs }}
        include_runtime_tuner=${{ inputs.include_runtime_tuner }}
        governor_mode=${{ inputs.governor_mode }}
        kerneltoast_patch_policy=${{ inputs.kerneltoast_patch_policy }}
        dirty_module_abi_bypass=${{ inputs.dirty_module_abi_bypass }}
        stock_boot_img_url=${{ inputs.stock_boot_img_url }}
        stock_boot_gdrive_id=${{ inputs.stock_boot_gdrive_id }}

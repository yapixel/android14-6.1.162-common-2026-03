name: Build GKI Kernel with KernelSU Variants (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant to build'
        required: true
        default: 'enhance'
        type: choice
        options:
          - all
          - enhance
          - tiann
          - kowsu
          - resukisu
          - next
      disable_susfs:
        description: 'Disable SuSFS features'
        required: false
        default: false
        type: boolean
      force_clean_build:
        description: 'Force clean build (ignore cache)'
        required: false
        default: false
        type: boolean
      enable_telegram:
        description: 'Enable Telegram notifications'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: true
        type: boolean
      dry_run_only:
        description: 'Validate source sync and patch application only'
        required: false
        default: false
        type: boolean
      dirty_build:
        description: 'Incremental build; useful only on persistent runners'
        required: false
        default: false
        type: boolean
      android_version:
        description: 'Android version target'
        required: false
        default: 'android16'
        type: choice
        options: [android14, android16, android17]
      refs:
        description: 'Advanced refs, newline key=value. Example: kernel_ref=android14-6.1-lts'
        required: false
        default: ''
        type: string
      build_options:
        description: 'Advanced options, newline key=value. Example: tuning_profile=balanced'
        required: false
        default: ''
        type: string

  workflow_call:
    inputs:
      use_self_hosted:
        required: false
        default: false
        type: boolean
      ksu_variant:
        required: false
        default: 'enhance'
        type: string
      disable_susfs:
        required: false
        default: false
        type: boolean
      force_clean_build:
        required: false
        default: false
        type: boolean
      enable_telegram:
        required: false
        default: false
        type: boolean
      create_release:
        required: false
        default: true
        type: boolean
      dry_run_only:
        required: false
        default: false
        type: boolean
      dirty_build:
        required: false
        default: false
        type: boolean
      dirty_module_abi_bypass:
        required: false
        default: true
        type: boolean
      android_version:
        required: false
        default: 'android16'
        type: string
      kernel_ref:
        required: false
        default: ''
        type: string
      kernel_ref_android17:
        required: false
        default: ''
        type: string
      susfs_ref:
        required: false
        default: 'gki-android14-6.1-dev'
        type: string
      tiann_ref:
        required: false
        default: '0544f475962fd7f27d27ae24a7ab3ee2a8d7538a'
        type: string
      kowsu_ref:
        required: false
        default: 'master'
        type: string
      resukisu_ref:
        required: false
        default: 'main'
        type: string
      next_ref:
        required: false
        default: 'dev'
        type: string
      tuning_profile:
        required: false
        default: 'balanced'
        type: string
      lto_mode:
        required: false
        default: 'thin'
        type: string
      make_jobs:
        required: false
        default: 'auto'
        type: string
      include_runtime_tuner:
        required: false
        default: true
        type: boolean
      governor_mode:
        required: false
        default: 'dynasched'
        type: string
      kerneltoast_patch_policy:
        required: false
        default: 'best_effort'
        type: string
      stock_boot_img_url:
        required: false
        default: ''
        type: string
      stock_boot_gdrive_id:
        required: false
        default: ''
        type: string
      refs:
        required: false
        default: ''
        type: string
      build_options:
        required: false
        default: ''
        type: string

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

concurrency:
  group: kernel-build-hosted-${{ github.ref_name }}-${{ inputs.ksu_variant || 'enhance' }}
  cancel-in-progress: false

env:
  LLVM_VERSION: '20'
  KERNEL_REPO_URL: https://android.googlesource.com/kernel/common.git
  SUSFS_REPO_URL: https://gitlab.com/simonpunk/susfs4ksu
  TIANN_REPO_URL: https://github.com/tiann/KernelSU.git
  KOWSU_REPO_URL: https://github.com/KOWX712/KernelSU.git
  RESUKISU_REPO_URL: https://github.com/ReSukiSU/ReSukiSU.git
  NEXT_REPO_URL: https://github.com/KernelSU-Next/KernelSU-Next.git
  ANYKERNEL_REPO_URL: https://github.com/deepongi-labs/AnyKernel3-p8a
  ENHANCE_KSU_REF: da8e0ab1786dc55cce3ed4ff4c304be614e0fa0a
  ANDROID16_KERNEL_REF: android14-6.1-lts
  ANDROID17_KERNEL_REF: android17-6.18-2026-06
  PATCHES_REPO_SHA: 4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e
  CLIDR_PATCH_URL: https://raw.githubusercontent.com/infectedmushi/kernel_patches/4cbfb5f8c15acf6b3b797151a54a3a56dc6a843e/fix-clidr-uninitialized.patch
  WIFI_PATCH_URL: https://github.com/OnePlus-12-Development/android_kernel_qcom_sm8650/commit/3e0cb08.patch
  KT_PATCH_ARCH_TOPOLOGY_MIN_FREQ_SCALE_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/48a3fd5e41.patch
  KT_PATCH_SCHED_CASS_UCLAMP_PACKING_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/201c5c7c99.patch
  KT_PATCH_SCHEDUTIL_IGNORE_FIE_RATELIMIT_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/56040db35c.patch
  KT_PATCH_SCHEDUTIL_DEFAULT_RATELIMIT_URL: https://github.com/kerneltoast/android_kernel_google_tensynos/commit/627184a51c.patch

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      enable_susfs: ${{ steps.config.outputs.enable_susfs }}
      force_clean: ${{ steps.config.outputs.force_clean }}
      dirty_build: ${{ steps.config.outputs.dirty_build }}
      dry_run: ${{ steps.config.outputs.dry_run }}
      build_start_time: ${{ steps.timestamp.outputs.start_time }}
      create_release: ${{ steps.config.outputs.create_release }}
      android_version: ${{ steps.config.outputs.android_version }}
      kernel_ref: ${{ steps.config.outputs.kernel_ref }}
      kernel_ref_android17: ${{ steps.config.outputs.kernel_ref_android17 }}
      susfs_ref: ${{ steps.config.outputs.susfs_ref }}
      tiann_ref: ${{ steps.config.outputs.tiann_ref }}
      kowsu_ref: ${{ steps.config.outputs.kowsu_ref }}
      resukisu_ref: ${{ steps.config.outputs.resukisu_ref }}
      next_ref: ${{ steps.config.outputs.next_ref }}
      tuning_profile: ${{ steps.config.outputs.tuning_profile }}
      lto_mode: ${{ steps.config.outputs.lto_mode }}
      make_jobs: ${{ steps.config.outputs.make_jobs }}
      include_runtime_tuner: ${{ steps.config.outputs.include_runtime_tuner }}
      governor_mode: ${{ steps.config.outputs.governor_mode }}
      kerneltoast_patch_policy: ${{ steps.config.outputs.kerneltoast_patch_policy }}
      dirty_module_abi_bypass: ${{ steps.config.outputs.dirty_module_abi_bypass }}
      stock_boot_img_url: ${{ steps.config.outputs.stock_boot_img_url }}
      stock_boot_gdrive_id: ${{ steps.config.outputs.stock_boot_gdrive_id }}
    steps:
      - name: Record Build Start Time
        id: timestamp
        run: |
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> "$GITHUB_OUTPUT"
          echo "Workflow started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set Build Matrix
        id: set-matrix
        run: |
          VARIANT="${{ inputs.ksu_variant }}"
          if [ "$VARIANT" = "all" ]; then
            echo 'matrix={"variant":["tiann","kowsu","resukisu","next"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"variant\":[\"$VARIANT\"]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Build Config
        id: config
        run: |
          set -euo pipefail

          KERNEL_REF="${{ inputs.kernel_ref }}"
          KERNEL_REF_ANDROID17="${{ inputs.kernel_ref_android17 }}"
          ANDROID_VERSION="${{ inputs.android_version }}"
          SUSFS_REF="${{ inputs.susfs_ref }}"
          TIANN_REF="${{ inputs.tiann_ref }}"
          KOWSU_REF="${{ inputs.kowsu_ref }}"
          RESUKISU_REF="${{ inputs.resukisu_ref }}"
          NEXT_REF="${{ inputs.next_ref }}"
          TUNING_PROFILE="${{ inputs.tuning_profile }}"
          LTO_MODE="${{ inputs.lto_mode }}"
          MAKE_JOBS="${{ inputs.make_jobs }}"
          INCLUDE_RUNTIME_TUNER="${{ inputs.include_runtime_tuner }}"
          GOVERNOR_MODE="${{ inputs.governor_mode }}"
          KERNELTOAST_PATCH_POLICY="${{ inputs.kerneltoast_patch_policy }}"
          DIRTY_MODULE_ABI_BYPASS="${{ inputs.dirty_module_abi_bypass }}"
          STOCK_BOOT_IMG_URL="${{ inputs.stock_boot_img_url }}"
          STOCK_BOOT_GDRIVE_ID="${{ inputs.stock_boot_gdrive_id }}"

          REFS_INPUT=$(cat <<'__REFS_EOF__'
          ${{ inputs.refs }}
          __REFS_EOF__
          )
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            key="${key%"${key##*[![:space:]]}"}"
            key="${key#"${key%%[![:space:]]*}"}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            case "$key" in
              kernel_ref) KERNEL_REF="$value" ;;
              kernel_ref_android17) KERNEL_REF_ANDROID17="$value" ;;
              android_version) ANDROID_VERSION="$value" ;;
              susfs_ref) SUSFS_REF="$value" ;;
              tiann_ref) TIANN_REF="$value" ;;
              kowsu_ref) KOWSU_REF="$value" ;;
              resukisu_ref) RESUKISU_REF="$value" ;;
              next_ref) NEXT_REF="$value" ;;
              *) echo "Unknown key in refs: $key"; exit 1 ;;
            esac
          done <<< "$REFS_INPUT"

          BUILD_OPTIONS_INPUT=$(cat <<'__BUILD_OPTIONS_EOF__'
          ${{ inputs.build_options }}
          __BUILD_OPTIONS_EOF__
          )
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            key="${line%%=*}"
            value="${line#*=}"
            key="${key%"${key##*[![:space:]]}"}"
            key="${key#"${key%%[![:space:]]*}"}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            case "$key" in
              tuning_profile) TUNING_PROFILE="$value" ;;
              lto_mode) LTO_MODE="$value" ;;
              make_jobs) MAKE_JOBS="$value" ;;
              include_runtime_tuner) INCLUDE_RUNTIME_TUNER="$value" ;;
              governor_mode) GOVERNOR_MODE="$value" ;;
              kerneltoast_patch_policy) KERNELTOAST_PATCH_POLICY="$value" ;;
              dirty_module_abi_bypass) DIRTY_MODULE_ABI_BYPASS="$value" ;;
              stock_boot_img_url) STOCK_BOOT_IMG_URL="$value" ;;
              stock_boot_gdrive_id) STOCK_BOOT_GDRIVE_ID="$value" ;;
              *) echo "Unknown key in build_options: $key"; exit 1 ;;
            esac
          done <<< "$BUILD_OPTIONS_INPUT"

          if [ "${{ inputs.disable_susfs }}" = "true" ]; then
            ENABLE_SUSFS=false
          else
            ENABLE_SUSFS=true
          fi
          echo "enable_susfs=$ENABLE_SUSFS" >> "$GITHUB_OUTPUT"
          echo "force_clean=${{ inputs.force_clean_build }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force_clean_build }}" = "true" ]; then
            echo "dirty_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty_build=${{ inputs.dirty_build }}" >> "$GITHUB_OUTPUT"
          fi
          echo "dry_run=${{ inputs.dry_run_only }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.create_release }}" = "true" ] && [ "${{ inputs.dry_run_only }}" != "true" ]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

          ANDROID_VERSION="${ANDROID_VERSION:-android16}"
          case "$ANDROID_VERSION" in
            android14|android16|android17) ;;
            *) echo "Invalid android_version: $ANDROID_VERSION"; exit 1 ;;
          esac

          if [ "$ANDROID_VERSION" = "android17" ]; then
            RESOLVED_KERNEL_REF="${KERNEL_REF:-${KERNEL_REF_ANDROID17:-${ANDROID17_KERNEL_REF}}}"
            RESOLVED_SUSFS_REF="${SUSFS_REF:-gki-android17-6.18-dev}"
            RESOLVED_KERNEL_REF_ANDROID17="${KERNEL_REF_ANDROID17:-${ANDROID17_KERNEL_REF}}"
          elif [ "$ANDROID_VERSION" = "android16" ]; then
            RESOLVED_KERNEL_REF="${KERNEL_REF:-${ANDROID16_KERNEL_REF}}"
            RESOLVED_SUSFS_REF="${SUSFS_REF:-gki-android14-6.1-dev}"
            RESOLVED_KERNEL_REF_ANDROID17="${KERNEL_REF_ANDROID17:-${ANDROID17_KERNEL_REF}}"
          else
            RESOLVED_KERNEL_REF="${KERNEL_REF:-android14-6.1-lts}"
            RESOLVED_SUSFS_REF="${SUSFS_REF:-gki-android14-6.1-dev}"
            RESOLVED_KERNEL_REF_ANDROID17="${KERNEL_REF_ANDROID17:-${ANDROID17_KERNEL_REF}}"
          fi

          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel_ref=$RESOLVED_KERNEL_REF" >> "$GITHUB_OUTPUT"
          echo "kernel_ref_android17=$RESOLVED_KERNEL_REF_ANDROID17" >> "$GITHUB_OUTPUT"
          echo "susfs_ref=$RESOLVED_SUSFS_REF" >> "$GITHUB_OUTPUT"
          echo "tiann_ref=${TIANN_REF:-0544f475962fd7f27d27ae24a7ab3ee2a8d7538a}" >> "$GITHUB_OUTPUT"
          echo "kowsu_ref=${KOWSU_REF:-master}" >> "$GITHUB_OUTPUT"
          echo "resukisu_ref=${RESUKISU_REF:-main}" >> "$GITHUB_OUTPUT"
          echo "next_ref=${NEXT_REF:-dev}" >> "$GITHUB_OUTPUT"

          TUNING_PROFILE="${TUNING_PROFILE:-balanced}"
          case "$TUNING_PROFILE" in
            balanced|performance|battery) ;;
            *) echo "Invalid tuning_profile: $TUNING_PROFILE"; exit 1 ;;
          esac
          echo "tuning_profile=$TUNING_PROFILE" >> "$GITHUB_OUTPUT"

          LTO_MODE="${LTO_MODE:-thin}"
          case "$LTO_MODE" in
            thin|full|none) ;;
            *) echo "Invalid lto_mode: $LTO_MODE"; exit 1 ;;
          esac
          echo "lto_mode=$LTO_MODE" >> "$GITHUB_OUTPUT"

          MAKE_JOBS="${MAKE_JOBS:-auto}"
          if [ "$MAKE_JOBS" = "auto" ] || [[ "$MAKE_JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "make_jobs=$MAKE_JOBS" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid make_jobs: $MAKE_JOBS"; exit 1
          fi

          INCLUDE_RUNTIME_TUNER="${INCLUDE_RUNTIME_TUNER:-true}"
          case "$INCLUDE_RUNTIME_TUNER" in true|false) ;; *) echo "Invalid include_runtime_tuner: $INCLUDE_RUNTIME_TUNER"; exit 1 ;; esac
          echo "include_runtime_tuner=$INCLUDE_RUNTIME_TUNER" >> "$GITHUB_OUTPUT"

          GOVERNOR_MODE="${GOVERNOR_MODE:-dynasched}"
          case "$GOVERNOR_MODE" in
            dynasched|pixel8_dynamic_schedutil) GOVERNOR_MODE=dynasched ;;
            stock_schedutil) ;;
            *) echo "Invalid governor_mode: $GOVERNOR_MODE"; exit 1 ;;
          esac
          echo "governor_mode=$GOVERNOR_MODE" >> "$GITHUB_OUTPUT"

          KERNELTOAST_PATCH_POLICY="${KERNELTOAST_PATCH_POLICY:-best_effort}"
          case "$KERNELTOAST_PATCH_POLICY" in strict|best_effort|off) ;; *) echo "Invalid kerneltoast_patch_policy: $KERNELTOAST_PATCH_POLICY"; exit 1 ;; esac
          echo "kerneltoast_patch_policy=$KERNELTOAST_PATCH_POLICY" >> "$GITHUB_OUTPUT"

          DIRTY_MODULE_ABI_BYPASS="${DIRTY_MODULE_ABI_BYPASS:-true}"
          case "$DIRTY_MODULE_ABI_BYPASS" in true|false) ;; *) echo "Invalid dirty_module_abi_bypass: $DIRTY_MODULE_ABI_BYPASS"; exit 1 ;; esac
          echo "dirty_module_abi_bypass=$DIRTY_MODULE_ABI_BYPASS" >> "$GITHUB_OUTPUT"

          if [ -n "$STOCK_BOOT_IMG_URL" ]; then
            case "$STOCK_BOOT_IMG_URL" in https://*) ;; *) echo "stock_boot_img_url must start with https://"; exit 1 ;; esac
          fi
          if [ -n "$STOCK_BOOT_GDRIVE_ID" ]; then
            case "$STOCK_BOOT_GDRIVE_ID" in
              https://drive.google.com/file/d/*)
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID#*file/d/}"
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID%%/*}"
                ;;
              https://drive.google.com/open?id=*)
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID#*id=}"
                STOCK_BOOT_GDRIVE_ID="${STOCK_BOOT_GDRIVE_ID%%&*}"
                ;;
            esac
          fi
          echo "stock_boot_img_url=$STOCK_BOOT_IMG_URL" >> "$GITHUB_OUTPUT"
          echo "stock_boot_gdrive_id=$STOCK_BOOT_GDRIVE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      ENABLE_SUSFS: ${{ needs.setup.outputs.enable_susfs }}
      FORCE_CLEAN: ${{ needs.setup.outputs.force_clean }}
      DIRTY_BUILD: ${{ needs.setup.outputs.dirty_build }}
      DRY_RUN_ONLY: ${{ needs.setup.outputs.dry_run }}
      ANDROID_VERSION: ${{ needs.setup.outputs.android_version }}
      KSU_VARIANT: ${{ matrix.variant }}
      TUNING_PROFILE: ${{ needs.setup.outputs.tuning_profile }}
      LTO_MODE: ${{ needs.setup.outputs.lto_mode }}
      MAKE_JOBS_OVERRIDE: ${{ needs.setup.outputs.make_jobs }}
      RUNTIME_TUNER: ${{ needs.setup.outputs.include_runtime_tuner }}
      GOVERNOR_MODE: ${{ needs.setup.outputs.governor_mode }}
      KERNELTOAST_PATCH_POLICY: ${{ needs.setup.outputs.kerneltoast_patch_policy }}
      DIRTY_MODULE_ABI_BYPASS: ${{ needs.setup.outputs.dirty_module_abi_bypass }}
      STOCK_BOOT_IMG_URL: ${{ needs.setup.outputs.stock_boot_img_url }}
      STOCK_BOOT_GDRIVE_ID: ${{ needs.setup.outputs.stock_boot_gdrive_id }}
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1

      - name: Install hosted-runner dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl wget git patch make bc bison flex \
            build-essential libssl-dev libelf-dev libncurses-dev \
            dwarves ccache zip unzip lz4 xz-utils python3 python3-pip \
            rsync jq file gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

          if ! sudo apt-get install -y "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"; then
            echo "LLVM ${LLVM_VERSION} not available from default apt; using apt.llvm.org installer."
            curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh "${LLVM_VERSION}"
            sudo apt-get install -y "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          fi

          CLANG_BIN="/usr/lib/llvm-${LLVM_VERSION}/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(dirname "$(command -v clang)")"
          fi
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "ARM64_TOOLCHAIN=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "ARM32_TOOLCHAIN=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_ID=llvm-${LLVM_VERSION}-hosted" >> "$GITHUB_ENV"

          RUNNER_THREADS="$(nproc)"
          echo "RUNNER_THREADS=$RUNNER_THREADS" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$RUNNER_THREADS" >> "$GITHUB_ENV"
          echo "BUILD_LOAD=$((RUNNER_THREADS + 1))" >> "$GITHUB_ENV"
          echo "TMPDIR=${RUNNER_TEMP}/kernel-tmp" >> "$GITHUB_ENV"
          echo "TEMP=${RUNNER_TEMP}/kernel-tmp" >> "$GITHUB_ENV"
          echo "TMP=${RUNNER_TEMP}/kernel-tmp" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=mtime" >> "$GITHUB_ENV"
          echo "CCACHE_NOCOMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=10G" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/kernel-tmp" "${HOME}/.ccache/tmp"
          ccache -M 10G || true
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}" >/dev/null 2>&1 || true
          ccache --set-config=hash_dir=false >/dev/null 2>&1 || true
          ccache --set-config=compiler_check=mtime >/dev/null 2>&1 || true
          ccache --set-config=compression=false >/dev/null 2>&1 || true

          "$CLANG_BIN/clang" --version
          command -v pahole

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-llvm-${{ env.LLVM_VERSION }}-
            ccache-${{ runner.os }}-

      - name: Static analysis (shellcheck if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck || true
          else
            echo "shellcheck not installed; skipping"
          fi

      - name: Sync kernel and SuSFS sources
        run: |
          set -euo pipefail
          sync_repo_ref() {
            local name="$1" url="$2" ref="$3" target="$4"
            echo "::group::Sync ${name}"
            if [ -d "${target}/.git" ] && [ "${DIRTY_BUILD}" = "true" ]; then
              echo "DIRTY_BUILD=true: keeping existing ${target} checkout ($(git -C "$target" rev-parse --short HEAD))"
              echo "::endgroup::"
              return 0
            fi
            rm -rf "$target" ".git/modules/${target}" 2>/dev/null || true
            mkdir -p "$target"
            git -C "$target" init
            git -C "$target" remote add origin "$url"
            git -C "$target" fetch --depth=1 origin "$ref"
            git -C "$target" checkout --detach FETCH_HEAD
            git -C "$target" reset --hard FETCH_HEAD
            git -C "$target" clean -fdx
            echo "${name} -> $(git -C "$target" rev-parse --short HEAD)"
            echo "::endgroup::"
          }

          sync_repo_ref "kernel-common" "${KERNEL_REPO_URL}" "${{ needs.setup.outputs.kernel_ref }}" "kernel"
          sync_repo_ref "susfs4ksu" "${SUSFS_REPO_URL}" "${{ needs.setup.outputs.susfs_ref }}" "susfs4ksu"

      - name: Store commit info
        run: |
          set -euo pipefail
          record_commit_info() {
            local prefix="$1" repo_path="$2"
            echo "${prefix}_COMMIT_SHORT=$(git -C "$repo_path" log -1 --format='%h')" >> "$GITHUB_ENV"
            echo "${prefix}_COMMIT_DATE=$(git -C "$repo_path" log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
            echo "${prefix}_COMMIT_MSG=$(git -C "$repo_path" log -1 --format='%s')" >> "$GITHUB_ENV"
          }
          record_commit_info WORKFLOW .
          record_commit_info KERNEL kernel
          record_commit_info SUSFS susfs4ksu

      - name: Initialize logs and patch manifest
        run: |
          mkdir -p logs success-metadata changelogs
          PATCH_MANIFEST="$GITHUB_WORKSPACE/logs/patch-manifest-${KSU_VARIANT}.txt"
          PATCH_FAILURE_LOG="$GITHUB_WORKSPACE/logs/patch-failure-${KSU_VARIANT}.log"
          : > "$PATCH_MANIFEST"
          : > "$PATCH_FAILURE_LOG"
          echo "PATCH_MANIFEST=$PATCH_MANIFEST" >> "$GITHUB_ENV"
          echo "PATCH_FAILURE_LOG=$PATCH_FAILURE_LOG" >> "$GITHUB_ENV"

      - name: Show ccache status
        run: |
          export CCACHE_DIR="${CCACHE_DIR}"
          ccache -s | grep -E "(Cacheable calls|Hits|Misses|Hit rate|cache size)" || true
          ccache -z || true

      - name: Setup KernelSU variant
        run: |
          set -euo pipefail
          sync_variant_repo() {
            local name="$1" url="$2" ref="$3" target="$4"
            echo "::group::Sync ${name}"
            rm -rf "$target"
            mkdir -p "$target"
            git -C "$target" init
            git -C "$target" remote add origin "$url"
            git -C "$target" fetch --depth=1 origin "$ref" || git -C "$target" fetch origin "$ref"
            git -C "$target" checkout --detach FETCH_HEAD
            echo "${name} -> $(git -C "$target" rev-parse --short HEAD)"
            echo "::endgroup::"
          }

          if [ "${DIRTY_BUILD}" != "true" ]; then
            rm -rf kernel/KernelSU kernel/KernelSU-Next kernel/drivers/kernelsu .ksu-src
          fi

          case "${KSU_VARIANT}" in
            enhance) KSU_REPO="${TIANN_REPO_URL}"; KSU_BRANCH="${ENHANCE_KSU_REF}" ;;
            tiann) KSU_REPO="${TIANN_REPO_URL}"; KSU_BRANCH="${{ needs.setup.outputs.tiann_ref }}" ;;
            kowsu) KSU_REPO="${KOWSU_REPO_URL}"; KSU_BRANCH="${{ needs.setup.outputs.kowsu_ref }}" ;;
            resukisu) KSU_REPO="${RESUKISU_REPO_URL}"; KSU_BRANCH="${{ needs.setup.outputs.resukisu_ref }}" ;;
            next) KSU_REPO="${NEXT_REPO_URL}"; KSU_BRANCH="${{ needs.setup.outputs.next_ref }}" ;;
            *) echo "Invalid KSU_VARIANT=${KSU_VARIANT}"; exit 1 ;;
          esac

          if [ "${KSU_VARIANT}" = "tiann" ] || [ "${KSU_VARIANT}" = "enhance" ]; then
            cd kernel
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_BRANCH}/kernel/setup.sh" | bash -s "$KSU_BRANCH"
            cd ..
            KSU_STAGE="${GITHUB_WORKSPACE}/kernel/KernelSU"
          else
            KSU_STAGE="${GITHUB_WORKSPACE}/.ksu-src"
            sync_variant_repo "ksu-${KSU_VARIANT}" "$KSU_REPO" "$KSU_BRANCH" "$KSU_STAGE"
          fi

          test -d "$KSU_STAGE/kernel"
          echo "KSU_REPO=$KSU_REPO" >> "$GITHUB_ENV"
          echo "KSU_BRANCH=$KSU_BRANCH" >> "$GITHUB_ENV"
          echo "KSU_STAGE=$KSU_STAGE" >> "$GITHUB_ENV"

      - name: Get KSU version info
        run: |
          set -euo pipefail
          cd "${KSU_STAGE}"
          git fetch --unshallow --quiet || git fetch --depth=10000 --quiet || true
          KSU_COUNT=$(git rev-list --count HEAD)
          if [ "${KSU_VARIANT}" = "resukisu" ]; then
            KSU_VERSION=$((40000 + KSU_COUNT - 2815))
          else
            KSU_VERSION=$((KSU_COUNT + 30000))
          fi
          KSU_COMMIT_SHORT=$(git log -1 --format='%h')
          KSU_VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-${KSU_COMMIT_SHORT}")
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
          echo "KSU_VERSION_TAG=$KSU_VERSION_TAG" >> "$GITHUB_ENV"
          echo "KSU_COMMIT_SHORT=$KSU_COMMIT_SHORT" >> "$GITHUB_ENV"
          echo "KSU_COMMIT_DATE=$(git log -1 --format='%cd' --date=format:'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "KSU_COMMIT_MSG=$(git log -1 --format='%s')" >> "$GITHUB_ENV"

      - name: Generate changelog
        run: |
          CHANGELOG_FILE="changelogs/CHANGELOG-${KSU_VARIANT}.md"
          cat > "$CHANGELOG_FILE" <<EOF_CHANGELOG
          # Pixel 8 Kernel Build

          **Variant:** ${KSU_VARIANT}
          **Build Number:** #${GITHUB_RUN_NUMBER}
          **KernelSU Version:** r${KSU_VERSION}
          **SuSFS:** ${ENABLE_SUSFS}
          **Android target:** ${{ needs.setup.outputs.android_version }}
          **Kernel ref:** ${{ needs.setup.outputs.kernel_ref }}

          ## Component Versions
          | Component | Commit | Date | Summary |
          |---|---|---|---|
          | KernelSU | \`${KSU_COMMIT_SHORT}\` | ${KSU_COMMIT_DATE} | ${KSU_COMMIT_MSG} |
          | Kernel | \`${KERNEL_COMMIT_SHORT}\` | ${KERNEL_COMMIT_DATE} | ${KERNEL_COMMIT_MSG} |
          | SuSFS4KSU | \`${SUSFS_COMMIT_SHORT}\` | ${SUSFS_COMMIT_DATE} | ${SUSFS_COMMIT_MSG} |
          EOF_CHANGELOG
          echo "CHANGELOG_FILE=$CHANGELOG_FILE" >> "$GITHUB_ENV"

      - name: Setup SuSFS
        if: env.ENABLE_SUSFS == 'true'
        run: bash .github/scripts/setup-susfs.sh

      - name: Inject SuSFS Kconfig for KernelSU-Next
        if: env.ENABLE_SUSFS == 'true' && env.KSU_VARIANT == 'next'
        run: |
          set -euo pipefail
          KSU_KCONFIG="${KSU_STAGE}/kernel/Kconfig"
          if ! grep -q 'config KSU_SUSFS' "$KSU_KCONFIG" 2>/dev/null; then
            cat >> "$KSU_KCONFIG" <<'KCONFIGEOF'

          menu "KernelSU - SUSFS"
          config KSU_SUSFS
          bool "KernelSU addon - SUSFS"
          depends on KSU
          default y

          config KSU_SUSFS_SUS_PATH
          bool "Enable to hide suspicious path"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SUS_MOUNT
          bool "Enable to hide suspicious mounts"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SUS_KSTAT
          bool "Enable to spoof suspicious kstat"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_TRY_UMOUNT
          bool "Enable to use ksu's try_umount"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SPOOF_UNAME
          bool "Enable to spoof uname"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_ENABLE_LOG
          bool "Enable logging susfs log to kernel"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          bool "Enable to hide ksu/susfs symbols"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          bool "Enable to spoof /proc/bootconfig or /proc/cmdline"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_OPEN_REDIRECT
          bool "Enable to redirect path opens"
          depends on KSU_SUSFS
          default y

          config KSU_SUSFS_SUS_MAP
          bool "Enable to hide mmapped files from proc maps"
          depends on KSU_SUSFS
          default y

          endmenu
          KCONFIGEOF
            printf '%s | %s | injected\n' "KernelSU-Next SuSFS Kconfig" "$KSU_KCONFIG" >> "$PATCH_MANIFEST"
          fi

      - name: Validate SuSFS integration
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -euo pipefail
          errors=0
          [ -f kernel/fs/susfs.c ] || { echo "::error::kernel/fs/susfs.c missing"; errors=$((errors + 1)); }
          [ -f kernel/include/linux/susfs.h ] || { echo "::error::kernel/include/linux/susfs.h missing"; errors=$((errors + 1)); }
          if [ "${KSU_VARIANT}" != "next" ]; then
            if ! grep -q 'config KSU_SUSFS' "${KSU_STAGE}/kernel/Kconfig" 2>/dev/null \
              && ! grep -q 'KSU_SUSFS' "${KSU_STAGE}/kernel/Makefile" 2>/dev/null \
              && ! grep -q 'KSU_SUSFS' "${KSU_STAGE}/kernel/Kbuild" 2>/dev/null; then
              echo "::error::KernelSU-side SuSFS integration missing"
              errors=$((errors + 1))
            fi
            for required_cmd in CMD_SUSFS_SHOW_ENABLED_FEATURES CMD_SUSFS_SHOW_VERSION CMD_SUSFS_SHOW_VARIANT; do
              if ! grep -Rqs "$required_cmd" "${KSU_STAGE}/kernel"; then
                echo "::error::$required_cmd handler missing"
                errors=$((errors + 1))
              fi
            done
          fi
          disabled_count=$(grep -c '| disabled$' "$PATCH_MANIFEST" 2>/dev/null || true)
          disabled_count="${disabled_count:-0}"
          if [ "$disabled_count" -gt 0 ]; then
            echo "::error::$disabled_count SuSFS patch(es) were disabled"
            errors=$((errors + disabled_count))
          fi
          [ "$errors" -eq 0 ] || exit 1

      - name: Integrate KernelSU into kernel tree
        run: |
          set -euo pipefail
          test -d "${KSU_STAGE}/kernel"
          rm -rf kernel/drivers/kernelsu
          mkdir -p kernel/drivers
          ln -s "${KSU_STAGE}/kernel" kernel/drivers/kernelsu
          test -f kernel/drivers/kernelsu/Kconfig

          if [ -d "${KSU_STAGE}/uapi" ]; then
            rm -rf "${KSU_STAGE}/kernel/uapi" "${KSU_STAGE}/kernel/include/uapi"
            mkdir -p "${KSU_STAGE}/kernel/uapi" "${KSU_STAGE}/kernel/include/uapi"
            cp -a "${KSU_STAGE}/uapi/." "${KSU_STAGE}/kernel/uapi/"
            cp -a "${KSU_STAGE}/uapi/." "${KSU_STAGE}/kernel/include/uapi/"
          elif [ -e "${KSU_STAGE}/kernel/include/uapi" ]; then
            rm -rf "${KSU_STAGE}/kernel/include/uapi.real"
            mkdir -p "${KSU_STAGE}/kernel/include/uapi.real"
            cp -aL "${KSU_STAGE}/kernel/include/uapi/." "${KSU_STAGE}/kernel/include/uapi.real/"
            rm -rf "${KSU_STAGE}/kernel/include/uapi"
            mv "${KSU_STAGE}/kernel/include/uapi.real" "${KSU_STAGE}/kernel/include/uapi"
          fi

          if [ -f kernel/drivers/kernelsu/Kbuild ]; then
            python3 -c 'from pathlib import Path; import sys; version, tag = sys.argv[1], sys.argv[2]; p = Path("kernel/drivers/kernelsu/Kbuild"); text = p.read_text(); text = text.replace("KSU_VERSION_FALLBACK := 1", f"KSU_VERSION_FALLBACK := {version}"); text = text.replace("KSU_VERSION_TAG_FALLBACK := v0.0.1", f"KSU_VERSION_TAG_FALLBACK := {tag}"); p.write_text(text)' "$KSU_VERSION" "$KSU_VERSION_TAG"
          fi

          if ! grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' kernel/drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> kernel/drivers/Makefile
          fi
          if ! grep -Fq 'source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          fi

      - name: Apply remote patches and source fixes
        run: bash .github/scripts/apply-remote-patches.sh

      - name: Verify patched tree
        run: |
          set -euo pipefail
          mkdir -p success-metadata
          if [ "${ENABLE_SUSFS}" = "true" ]; then
            test -f kernel/fs/susfs.c
            test -f kernel/include/linux/susfs.h
          fi
          {
            echo "variant=${KSU_VARIANT}"
            echo "kernel_ref=${{ needs.setup.outputs.kernel_ref }}"
            echo "susfs_ref=${{ needs.setup.outputs.susfs_ref }}"
            echo "ksu_repo=${KSU_REPO}"
            echo "ksu_ref=${KSU_BRANCH}"
            echo "enable_susfs=${ENABLE_SUSFS}"
            echo "dry_run=${DRY_RUN_ONLY}"
            echo "tuning_profile=${TUNING_PROFILE}"
            echo "lto_mode=${LTO_MODE}"
            echo "make_jobs=${MAKE_JOBS_OVERRIDE}"
            echo "runtime_tuner=${RUNTIME_TUNER}"
            echo "governor_mode=${GOVERNOR_MODE}"
            echo "kerneltoast_patch_policy=${KERNELTOAST_PATCH_POLICY}"
            echo "dirty_module_abi_bypass=${DIRTY_MODULE_ABI_BYPASS}"
          } > "success-metadata/source-manifest-${KSU_VARIANT}.txt"

      - name: Stop after patch validation
        if: env.DRY_RUN_ONLY == 'true'
        run: |
          echo "Dry run complete for ${KSU_VARIANT}. Compile intentionally skipped." >> "$GITHUB_STEP_SUMMARY"

      - name: Build kernel
        if: env.DRY_RUN_ONLY != 'true'
        run: bash .github/scripts/build-kernel.sh

      - name: Package kernel with AnyKernel3
        if: env.DRY_RUN_ONLY != 'true'
        run: |
          set -euo pipefail
          cd kernel
          KERNEL_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' Makefile)
          cd ..

          DIRTY_SUFFIX=""
          if [ "${DIRTY_MODULE_ABI_BYPASS}" = "true" ]; then
            DIRTY_SUFFIX="-dirtyabi"
          fi

          case "${KSU_VARIANT}" in
            enhance|tiann) AK3_BRANCH="KernelSU" ;;
            kowsu) AK3_BRANCH="KowSU" ;;
            resukisu) AK3_BRANCH="resukisu" ;;
            next) AK3_BRANCH="next" ;;
          esac

          git clone --depth=1 --branch="$AK3_BRANCH" "${ANYKERNEL_REPO_URL}" AnyKernel3 \
            || git clone --depth=1 --branch=main "${ANYKERNEL_REPO_URL}" AnyKernel3

          bash .github/scripts/prepare-anykernel3.sh AnyKernel3

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          [ -f kernel/out/arch/arm64/boot/dtb ] && cp kernel/out/arch/arm64/boot/dtb AnyKernel3/

          cd AnyKernel3
          rm -rf .git .github
          ZIP_NAME="AK3-${KERNEL_VERSION}-${KSU_VARIANT}${DIRTY_SUFFIX}-r${KSU_VERSION}.zip"
          zip -r9 "../$ZIP_NAME" .
          cd ..
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          if command -v lz4 >/dev/null 2>&1; then
            lz4 -9 -f kernel/out/arch/arm64/boot/Image "Image-${KERNEL_VERSION}-${KSU_VARIANT}${DIRTY_SUFFIX}.lz4"
            echo "IMAGE_LZ4=Image-${KERNEL_VERSION}-${KSU_VARIANT}${DIRTY_SUFFIX}.lz4" >> "$GITHUB_ENV"
          else
            echo "IMAGE_LZ4=" >> "$GITHUB_ENV"
          fi
          echo "KERNEL_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Repack akita boot.img with ksud
        if: env.DRY_RUN_ONLY != 'true' && env.KSU_VARIANT != 'enhance' && (env.STOCK_BOOT_IMG_URL != '' || env.STOCK_BOOT_GDRIVE_ID != '')
        run: |
          set -euo pipefail
          command -v cargo >/dev/null 2>&1 || { echo "::warning::cargo not found; skipping boot.img repack"; exit 0; }
          REPACK_DIR="$(mktemp -d)"
          if [ -n "${STOCK_BOOT_GDRIVE_ID}" ]; then
            python3 -m pip install --user --quiet gdown
            export PATH="${HOME}/.local/bin:${PATH}"
            gdown --id "${STOCK_BOOT_GDRIVE_ID}" -O "${REPACK_DIR}/stock_boot.img"
          else
            curl -fsSL "${STOCK_BOOT_IMG_URL}" -o "${REPACK_DIR}/stock_boot.img"
          fi
          TIANN_KSUD_STAGE="${GITHUB_WORKSPACE}/kernel/KernelSU"
          if [ ! -f "${TIANN_KSUD_STAGE}/Cargo.toml" ]; then
            TIANN_KSUD_STAGE="${GITHUB_WORKSPACE}/.tiann-ksu-src"
            rm -rf "$TIANN_KSUD_STAGE"
            git clone --depth=1 --branch "${{ needs.setup.outputs.tiann_ref }}" "${TIANN_REPO_URL}" "$TIANN_KSUD_STAGE" \
              || git clone --depth=1 "${TIANN_REPO_URL}" "$TIANN_KSUD_STAGE"
          fi
          rustup default stable || true
          cargo build --manifest-path "${TIANN_KSUD_STAGE}/Cargo.toml" --release -p ksud
          KSUD="${TIANN_KSUD_STAGE}/target/release/ksud"
          test -x "$KSUD"
          "$KSUD" boot-patch \
            -b "${REPACK_DIR}/stock_boot.img" \
            -k "${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image" \
            --no-install \
            -o "${REPACK_DIR}"
          PATCHED_IMG=$(find "${REPACK_DIR}" -name '*patched*boot*' -o -name 'new-boot.img' | head -1)
          [ -n "$PATCHED_IMG" ] && [ -f "$PATCHED_IMG" ] || { echo "::error::ksud did not produce a patched boot image"; exit 1; }
          KERNEL_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' kernel/Makefile)
          BOOT_IMG_NAME="boot-${KERNEL_VERSION}-${KSU_VARIANT}-r${KSU_VERSION}-akita.img"
          cp "$PATCHED_IMG" "$BOOT_IMG_NAME"
          sha256sum "$BOOT_IMG_NAME" > "${BOOT_IMG_NAME}.sha256"
          echo "REPACK_BOOT_IMG=$BOOT_IMG_NAME" >> "$GITHUB_ENV"

      - name: Generate Pixel 8 runtime tuner script
        if: env.DRY_RUN_ONLY != 'true'
        run: bash .github/scripts/generate-runtime-tuner.sh

      - name: Upload artifacts
        if: env.DRY_RUN_ONLY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ matrix.variant }}-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            ${{ env.KERNEL_ZIP }}
            ${{ env.KERNEL_ZIP }}.sha256
            ${{ env.IMAGE_LZ4 }}
            ${{ env.REPACK_BOOT_IMG }}
            ${{ env.REPACK_BOOT_IMG }}.sha256
            ${{ env.CHANGELOG_FILE }}
            logs/build-${{ matrix.variant }}.log
            logs/patch-manifest-${{ matrix.variant }}.txt
            logs/patch-failure-${{ matrix.variant }}.log
            kernel/out/.config
            kernel/out/include/config/auto.conf
            kernel/out/pixel8-profile-${{ env.TUNING_PROFILE }}.config
            success-metadata/pixel8-runtime-tuner-${{ matrix.variant }}.sh
            success-metadata/source-manifest-${{ matrix.variant }}.txt

      - name: Collect failure logs
        if: failure()
        run: |
          ARTIFACT_DIR="failure-logs/${KSU_VARIANT}"
          mkdir -p "$ARTIFACT_DIR"
          cp logs/*.log "$ARTIFACT_DIR/" 2>/dev/null || true
          cp logs/*.txt "$ARTIFACT_DIR/" 2>/dev/null || true
          [ -f kernel/out/.config ] && cp kernel/out/.config "$ARTIFACT_DIR/out.config" || true
          find kernel -type f \( -name '*.rej' -o -name '*.orig' \) -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs-${{ matrix.variant }}-${{ github.run_number }}
          path: failure-logs/${{ matrix.variant }}
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Variant \`${KSU_VARIANT}\`"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Android target | \`${ANDROID_VERSION}\` |"
            echo "| KernelSU repo | \`${KSU_REPO:-unknown}\` |"
            echo "| KernelSU ref | \`${KSU_BRANCH:-unknown}\` |"
            echo "| Kernel ref | \`${{ needs.setup.outputs.kernel_ref }}\` |"
            echo "| SuSFS ref | \`${{ needs.setup.outputs.susfs_ref }}\` |"
            echo "| Tuning profile | \`${TUNING_PROFILE}\` |"
            echo "| LTO mode | \`${LTO_MODE}\` |"
            echo "| Governor mode | \`${GOVERNOR_MODE}\` |"
            echo "| Patch policy | \`${KERNELTOAST_PATCH_POLICY}\` |"
            echo "| Build log | \`logs/build-${KSU_VARIANT}.log\` |"
            [ -n "${KERNEL_ZIP:-}" ] && echo "| ZIP artifact | \`${KERNEL_ZIP}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  create_release:
    needs: [setup, build]
    runs-on: ubuntu-22.04
    if: always() && needs.setup.result == 'success' && needs.setup.outputs.create_release == 'true' && needs.build.result == 'success' && needs.setup.outputs.dry_run != 'true'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t files < <(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.img' -o -name '*.lz4' -o -name '*.sha256' -o -name '*.md' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found; skipping release."
            exit 0
          fi
          RELEASE_TAG="build-${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="Pixel 8 Kernel Build #${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF_NOTES
          **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **SuSFS:** ${{ needs.setup.outputs.enable_susfs }}
          **Android target:** ${{ needs.setup.outputs.android_version }}

          ### Devices Supported
          - Pixel 8 (shiba)
          - Pixel 8 Pro (husky)
          - Pixel 8a (akita)

          Flash the AnyKernel3 ZIP in a kernel flasher. Boot image repack is only uploaded when a stock boot image was provided.
          EOF_NOTES
          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}"
            gh release upload "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md --repo "${GITHUB_REPOSITORY}" "${files[@]}"
          fi

  notify:
    needs: [setup, create_release, build]
    runs-on: ubuntu-22.04
    if: always() && inputs.enable_telegram && needs.setup.outputs.dry_run != 'true'
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          STATUS="${{ needs.build.result }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="⚠️"
          [ "$STATUS" = "failure" ] && ICON="❌"
          cat > tg_message.txt <<EOF_TG
          ${ICON} <b>Kernel Build ${STATUS}</b>
          ━━━━━━━━━━━━━━━━━━━━━
          📱 <b>Target:</b> Pixel 8 / 8 Pro / 8a
          🛠️ <b>Variant(s):</b> ${{ inputs.ksu_variant }}
          🛡️ <b>SuSFS:</b> ${{ needs.setup.outputs.enable_susfs }}
          🔗 <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run logs and artifacts</a>
          EOF_TG
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@tg_message.txt \
            -d parse_mode="HTML" \
